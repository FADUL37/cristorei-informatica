name: Publicar site completo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verificar configuração
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Falta CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Falta CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CLOUDFLARE_D1_DATABASE_ID" || { echo "Falta CLOUDFLARE_D1_DATABASE_ID"; exit 1; }
          test -n "$ADMIN_KEY" || { echo "Falta ADMIN_KEY"; exit 1; }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build:cloudflare
      - name: Atualizar banco
        run: npx wrangler d1 migrations apply DB --remote --config .deploy/wrangler.json
      - name: Publicar com senha de gestão
        shell: bash
        run: |
          printf '%s' "$ADMIN_KEY" | npx wrangler secret put ADMIN_KEY --config .deploy/wrangler.json
          npx wrangler deploy --config .deploy/wrangler.json
